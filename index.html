<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245b4b">
<title>許耕豪復健科班表工時計算機</title>
<style>
  :root { color-scheme: light; --green:#245b4b; --green2:#e8f3ee; --ink:#18231f; --muted:#68756f; --line:#dce5e0; --bg:#f4f7f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:620px; margin:0 auto; padding:18px 14px 36px; }
  .hero { display:flex; align-items:center; gap:12px; margin:6px 0 18px; }
  .logo { width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--green2);font-size:25px; }
  h1 { font-size:22px; margin:0 0 3px; }
  .sub { color:var(--muted);font-size:13px; }
  .panel { background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #152b2010; }
  label { display:block;font-size:13px;color:var(--muted);margin-bottom:7px; }
  input[type=text] { width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;background:white;color:var(--ink); }
  .section-head { display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px; }
  h2 { font-size:17px;margin:0; }
  button { font:inherit;cursor:pointer;touch-action:manipulation; }
  .smallbtn { border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:8px 11px;font-size:13px; }
  .shift { display:grid;grid-template-columns:minmax(0,1fr) 44px 48px 44px;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #edf1ee; }
  .shift:last-child { border-bottom:0; }
  .shiftname { font-weight:750;font-size:17px; }
  .hours { color:var(--muted);font-size:12px;margin-top:2px; }
  .step { width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:white;font-size:24px;line-height:1;color:var(--green); }
  .step.plus { background:var(--green);border-color:var(--green);color:white; }
  .step:disabled { opacity:.3;cursor:default; }
  .count { text-align:center;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums; }
  .count small { display:block;font-size:11px;font-weight:400;color:var(--muted); }
  .summary { background:var(--green2);border:1px solid #cfe3d9;border-radius:16px;padding:16px; }
  .personline { color:var(--muted);font-size:13px;margin-bottom:12px; }
  .totals { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
  .metric { background:#ffffffb8;border-radius:13px;padding:13px; }
  .metric .label { color:var(--muted);font-size:12px; }
  .metric strong { display:block;font-size:25px;line-height:1.35;margin-top:3px;font-variant-numeric:tabular-nums; }
  .actions { display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px; }
  .action { border:1px solid var(--line);border-radius:12px;padding:12px 10px;background:white;color:var(--ink);font-weight:650; }
  .action.primary { background:var(--green);color:white;border-color:var(--green); }
  .detail { margin-top:13px;border-top:1px solid #cfe3d9;padding-top:10px; }
  .detailrow { display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px; }
  .empty { color:var(--muted);font-size:13px;padding:8px 0; }
  .foot { color:var(--muted);font-size:12px;line-height:1.6;text-align:center;padding:4px 8px; }
  @media (max-width:360px) { main{padding:12px 9px}.panel{padding:12px}.shift{grid-template-columns:minmax(0,1fr) 39px 39px 39px;gap:5px}.step{width:38px;height:40px}.metric strong{font-size:22px} }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="logo" aria-hidden="true">🧮</div>
    <div><h1>許耕豪復健科班表工時計算機</h1><div class="sub">點擊加減班數，自動結算工時</div></div>
  </header>

  <section class="panel">
    <label for="person">人員名稱</label>
    <input id="person" type="text" value="" placeholder="例如：學長" autocomplete="off">
  </section>

  <section class="panel">
    <div class="section-head">
      <div><h2>班別與天數</h2><div class="sub">每按一次「＋」代表增加一天</div></div>
      <button class="smallbtn" id="reset" type="button">↻ 全部歸零</button>
    </div>
    <div id="shifts"></div>
  </section>

  <section class="panel">
    <div class="summary">
      <div class="personline" id="personline">未命名人員｜結算結果</div>
      <div class="totals">
        <div class="metric"><div class="label">總班數</div><strong id="days">0 天</strong></div>
        <div class="metric"><div class="label">總工時</div><strong id="hours">0 小時</strong></div>
      </div>
      <div class="actions">
        <button class="action" id="toggle" type="button">查看工時明細</button>
        <button class="action primary" id="copy" type="button">複製結算結果</button>
      </div>
      <div id="detail" class="detail" hidden></div>
    </div>
  </section>
  <div class="foot">班別規則：AB 8h、BC 7.5h、AC 8h、AB- 7.5h、ABC 11.5h、AB+ 8.5h、A／B／C 各 4h。<br>此檔案可離線開啟；輸入資料只在目前頁面使用，不會上傳。</div>
</main>
<script>
const shifts = [
  ["AB", 8], ["BC", 7.5], ["AC", 8], ["AB-", 7.5],
  ["ABC", 11.5], ["AB+", 8.5], ["A", 4], ["B", 4], ["C", 4]
];
const counts = Object.fromEntries(shifts.map(([name]) => [name, 0]));
const $ = id => document.getElementById(id);
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
function build() {
  $("shifts").innerHTML = "";
  shifts.forEach(([name, hours]) => {
    const row = document.createElement("div");
    row.className = "shift";
    row.innerHTML = `<div><div class="shiftname">${name}</div><div class="hours">${fmt(hours)} 小時／天</div></div>
      <button class="step minus" type="button" aria-label="減少 ${name} 班" data-shift="${name}" data-delta="-1">−</button>
      <div class="count" id="count-${name}">0<small>天</small></div>
      <button class="step plus" type="button" aria-label="增加 ${name} 班" data-shift="${name}" data-delta="1">＋</button>`;
    $("shifts").appendChild(row);
  });
  $("shifts").addEventListener("click", e => {
    const btn = e.target.closest("button[data-shift]");
    if (!btn) return;
    const name = btn.dataset.shift;
    counts[name] = Math.max(0, counts[name] + Number(btn.dataset.delta));
    render();
  });
}
function totals() {
  let days = 0, hours = 0;
  shifts.forEach(([name, h]) => { days += counts[name]; hours += counts[name] * h; });
  return {days, hours};
}
function resultText() {
  const person = $("person").value.trim() || "未命名人員";
  const lines = shifts.filter(([name]) => counts[name] > 0)
    .map(([name, h]) => `${name}：${counts[name]} 天 × ${fmt(h)} 小時 = ${fmt(counts[name] * h)} 小時`);
  const {days, hours} = totals();
  return `${person} 排班工時統計\\n${lines.length ? lines.join("\\n") : "尚未排班"}\\n總班數：${days} 天\\n總工時：${fmt(hours)} 小時`;
}
function render() {
  shifts.forEach(([name]) => {
    $(`count-${name}`).innerHTML = `${counts[name]}<small>天</small>`;
    const minus = document.querySelector(`button.minus[data-shift="${name}"]`);
    minus.disabled = counts[name] === 0;
  });
  const {days, hours} = totals();
  $("days").textContent = `${days} 天`;
  $("hours").textContent = `${fmt(hours)} 小時`;
  $("personline").textContent = `${$("person").value.trim() || "未命名人員"}｜結算結果`;
  const detail = $("detail");
  if (!$("toggle").dataset.open) { detail.hidden = true; return; }
  detail.hidden = false;
  const active = shifts.filter(([name]) => counts[name] > 0);
  detail.innerHTML = active.length
    ? active.map(([name,h]) => `<div class="detailrow"><span>${name} × ${counts[name]} 天</span><strong>${fmt(counts[name]*h)} 小時</strong></div>`).join("") +
      `<div class="detailrow" style="border-top:1px solid #cfe3d9;font-weight:750"><span>合計</span><strong>${fmt(hours)} 小時</strong></div>`
    : `<div class="empty">目前還沒有輸入任何班別。</div>`;
}
$("person").addEventListener("input", render);
$("reset").addEventListener("click", () => {
  shifts.forEach(([name]) => counts[name] = 0);
  $("toggle").dataset.open = "";
  $("toggle").textContent = "查看工時明細";
  render();
});
$("toggle").addEventListener("click", () => {
  if ($("toggle").dataset.open) {
    $("toggle").dataset.open = "";
    $("toggle").textContent = "查看工時明細";
  } else {
    $("toggle").dataset.open = "1";
    $("toggle").textContent = "收起工時明細";
  }
  render();
});
$("copy").addEventListener("click", async () => {
  const text = resultText();
  try {
    await navigator.clipboard.writeText(text);
    $("copy").textContent = "已複製！";
    setTimeout(() => $("copy").textContent = "複製結算結果", 1600);
  } catch (_) {
    const area = document.createElement("textarea");
    area.value = text; document.body.appendChild(area); area.select();
    const ok = document.execCommand("copy"); area.remove();
    $("copy").textContent = ok ? "已複製！" : "請手動複製";
    setTimeout(() => $("copy").textContent = "複製結算結果", 1600);
  }
});
build();
render();
</script>
</body>
</html>
